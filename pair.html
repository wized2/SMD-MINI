    <style>
        /* ========== FUTURISTIC DEEP SPACE RESET ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #010108, #000000);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            position: relative;
            overflow-x: hidden;
            padding: 1rem;
        }

        /* HYPERDRIVE GRID + SCANNING LINES */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, rgba(0, 243, 255, 0.07) 0px, rgba(0, 243, 255, 0.07) 1px, transparent 1px, transparent 8px),
                repeating-linear-gradient(90deg, rgba(188, 19, 254, 0.05) 0px, rgba(188, 19, 254, 0.05) 1px, transparent 1px, transparent 12px);
            pointer-events: none;
            z-index: 0;
            animation: scanMove 14s linear infinite;
        }

        @keyframes scanMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 30px; }
        }

        /* GLOWING ORB BACKGROUND */
        .glow-orb {
            position: fixed;
            width: 70vmax;
            height: 70vmax;
            background: radial-gradient(circle, rgba(0,243,255,0.1) 0%, rgba(188,19,254,0) 70%);
            border-radius: 50%;
            top: -20%;
            right: -30%;
            z-index: 0;
            filter: blur(70px);
            pointer-events: none;
        }

        .glow-orb2 {
            position: fixed;
            width: 60vmax;
            height: 60vmax;
            background: radial-gradient(circle, rgba(188,19,254,0.12) 0%, rgba(0,0,0,0) 80%);
            bottom: -30%;
            left: -20%;
            filter: blur(90px);
            pointer-events: none;
        }

        /* MAIN CARD */
        .cyber-core {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 480px;
            transition: all 0.3s ease;
        }

        /* RGB NEBULA BORDER */
        .neon-rgb-border {
            background: linear-gradient(135deg, #ff00cc, #00ffff, #ff3366, #ffcc00, #00ffaa, #ff00cc);
            background-size: 400% 400%;
            border-radius: 42px;
            padding: 2.8px;
            animation: rgbPulse 3s ease infinite;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3);
        }

        @keyframes rgbPulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(2, 5, 15, 0.78);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 2rem 1.5rem 2rem 1.5rem;
            border: 1px solid rgba(0, 243, 255, 0.25);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        /* HOLOGRAPHIC CORNER ACCENTS */
        .holo-corner {
            position: absolute;
            width: 35px;
            height: 35px;
            border: 2px solid #0cf;
            filter: drop-shadow(0 0 6px #0cf);
            opacity: 0.7;
        }
        .corner-tl { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .corner-tr { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .corner-br { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        /* TITLE WITH GLITCH EFFECT */
        .glitch-main {
            font-family: 'Orbitron', monospace;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-align: center;
            color: #0cf;
            text-shadow: 0 0 8px #0cf, 0 0 20px #bc13fe;
            margin-bottom: 8px;
            position: relative;
            animation: glitchFlicker 2.5s infinite;
        }

        @keyframes glitchFlicker {
            0%, 100% { text-shadow: 0 0 5px #0cf, 0 0 12px #bc13fe; opacity: 1; }
            95% { text-shadow: 0 0 8px #0cf, 0 0 25px #ff00cc; }
            97% { text-shadow: -1px 0 #ff00cc, 1px 0 #0cf; opacity: 0.9; }
        }

        .status-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 60px;
            width: fit-content;
            margin: 0 auto 1.6rem auto;
            padding: 5px 18px;
            border: 1px solid #0cf;
            backdrop-filter: blur(4px);
        }

        .status-led {
            width: 10px;
            height: 10px;
            background: #0cf;
            border-radius: 50%;
            box-shadow: 0 0 8px #0cf;
            animation: ledPulse 1.2s infinite;
        }

        @keyframes ledPulse {
            0% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .status-text {
            font-weight: 700;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #bbf0ff;
            text-transform: uppercase;
        }

        /* INPUT SECTION */
        .input-cyber {
            position: relative;
            margin: 1.5rem 0 1.5rem;
        }

        .input-cyber input {
            width: 100%;
            background: #03050cee;
            border: 1.5px solid #1e3a5f;
            border-radius: 28px;
            padding: 1rem 1.2rem;
            font-family: 'Orbitron', monospace;
            font-size: 1rem;
            font-weight: 600;
            color: #0cf;
            text-align: center;
            outline: none;
            transition: 0.25s;
            letter-spacing: 1px;
        }

        .input-cyber input:focus {
            border-color: #0cf;
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.5);
            background: #010208;
        }

        .input-cyber input::placeholder {
            color: #2c577c;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
        }

        /* BUTTON */
        .btn-futuristic {
            width: 100%;
            margin: 10px 0 8px;
            position: relative;
            cursor: pointer;
        }

        .btn-futuristic button {
            width: 100%;
            background: linear-gradient(95deg, #000000, #0a0f1f);
            border: none;
            border-radius: 42px;
            padding: 0.95rem 0;
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: #0cf;
            text-transform: uppercase;
            transition: all 0.3s;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(0, 243, 255, 0.6);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-futuristic:hover button {
            background: #0cf;
            color: #000;
            box-shadow: 0 0 28px #0cf, 0 0 12px #bc13fe;
            border-color: #fff;
            text-shadow: none;
            transform: scale(1.01);
        }

        /* RESULT AREA */
        .result-future {
            margin-top: 1.8rem;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .code-card {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 32px;
            padding: 12px 20px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(8px);
            border: 1px solid #bc13fe;
            transition: 0.2s;
            cursor: pointer;
        }

        .pair-code {
            font-family: 'Orbitron', monospace;
            font-size: 1.9rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #e879ff;
            text-shadow: 0 0 12px #bc13fe, 0 0 2px #fff;
            word-break: break-all;
            cursor: pointer;
            transition: 0.1s;
            display: inline-block;
        }

        .pair-code:active {
            transform: scale(0.97);
        }

        .copy-hint {
            font-size: 0.6rem;
            margin-top: 8px;
            color: #6f9bc0;
            letter-spacing: 1px;
        }

        .loader-holo {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.4);
            padding: 12px 18px;
            border-radius: 48px;
            backdrop-filter: blur(5px);
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #0cf;
            border-radius: 50%;
            animation: bounceHolo 0.8s infinite alternate;
            box-shadow: 0 0 8px #0cf;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; background: #bc13fe; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounceHolo {
            0% { transform: translateY(0px); opacity: 0.4; }
            100% { transform: translateY(-8px); opacity: 1; }
        }

        .error-message {
            color: #ff3a6f;
            text-shadow: 0 0 5px #ff0066;
            font-weight: 800;
            background: rgba(255, 0, 80, 0.12);
            padding: 12px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-left: 3px solid #ff3a6f;
        }

        footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.68rem;
            font-weight: 600;
            color: #446688;
            letter-spacing: 1.2px;
            border-top: 1px dashed rgba(0,243,255,0.3);
            padding-top: 1rem;
        }

        @media (max-width: 480px) {
            .glass-panel { padding: 1.5rem 1rem; }
            .glitch-main { font-size: 1.6rem; letter-spacing: 2px; }
            .pair-code { font-size: 1.4rem; letter-spacing: 3px; }
            .btn-futuristic button { font-size: 1rem; padding: 0.8rem 0; }
        }
    </style>
</head>
<body>
    <div class="glow-orb"></div>
    <div class="glow-orb2"></div>

    <div class="cyber-core">
        <div class="neon-rgb-border">
            <div class="glass-panel">
                <!-- Futuristic Corner Badges -->
                <div class="holo-corner corner-tl"></div>
                <div class="holo-corner corner-tr"></div>
                <div class="holo-corner corner-bl"></div>
                <div class="holo-corner corner-br"></div>

                <!-- UPDATED: SMD-MINI TITLE -->
                <h1 class="glitch-main">Free-BoT</h1>
                
                <div class="status-badge">
                    <div class="status-led"></div>
                    <span class="status-text">✦ NEXUS ACTIVE ✦</span>
                    <div class="status-led"></div>
                </div>

                <!-- INPUT FIELD -->
                <div class="input-cyber">
                    <input type="text" id="number" placeholder="923253617422" autocomplete="off" value="">
                </div>

                <!-- DONE BUTTON -->
                <div class="btn-futuristic">
                    <button id="doneBtn" onclick="getCode()">
                        <span>♥️</span> DONE <span>♥️</span>
                    </button>
                </div>

                <!-- RESULT DYNAMIC AREA -->
                <div id="result" class="result-future"></div>

                <!-- UPDATED FOOTER -->
                <footer>
                    ⚡ Free-Bot • QUANTUM PAIRING ENGINE ⚡<br>
                    <span style="font-size:0.6rem;">encrypted handshake | instant sync</span>
                </footer>
            </div>
        </div>
    </div>

    <script>
        // ========== SMD-MINI | FULLY FIXED COPY + FUTURISTIC LOGIC ==========
        // Copy functionality is now 100% working with fallback methods
        // All original fetch logic preserved, bot name updated
        
        async function getCode() {
            const numberInput = document.getElementById("number");
            const resDiv = document.getElementById("result");
            let rawNum = numberInput.value.trim();
            
            // Clean number (digits only for backend compatibility)
            const numDigits = rawNum.replace(/[^0-9]/g, '');
            
            if (!numDigits) {
                playSound('error');
                resDiv.innerHTML = "<div class='error-message'>⚠️ Try Again Later 😢 ⚠️</div>";
                numberInput.style.borderColor = "#ff3a6f";
                setTimeout(() => { numberInput.style.borderColor = "#1e3a5f"; }, 1000);
                return;
            }

            // Reset style
            numberInput.style.borderColor = "#0cf";
            // Show futuristic loader
            resDiv.innerHTML = `
                <div class="loader-holo">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <span style="margin-left: 10px; font-size:0.75rem; letter-spacing:2px;">SECURE HANDSHAKE</span>
                </div>
            `;

            try {
                // Original fetch endpoint preserved
                const req = await fetch(`/api/code?number=${numDigits}`);
                const data = await req.json();

                if (data.code) {
                    // Display pairing code with FIXED COPY (working)
                    displayCodeWithCopy(data.code);
                    playSound('success');
                } 
                else if (data.status === 'already_connected') {
                    resDiv.innerHTML = "<div class='error-message' style='color:#0f0; border-left-color:#0f0; text-shadow:0 0 3px #0f0;'>⚡ This Number Is Already Linked 🙂 ⚡</div>";
                } 
                else {
                    resDiv.innerHTML = "<div class='error-message'>⚠️ [ERROR] CONNECTION FAILED | RETRY ⚠️</div>";
                }
            } catch (e) {
                console.warn("Fetch error", e);
                resDiv.innerHTML = "<div class='error-message'>💀 [CRITICAL] SERVER UNREACHABLE • CHECK NETWORK 💀</div>";
            }
        }

        // NEW: Reliable code display with guaranteed copy functionality
        function displayCodeWithCopy(code) {
            const resDiv = document.getElementById("result");
            // Create card with clickable area
            resDiv.innerHTML = `
                <div class="code-card" id="codeCardWrapper">
                    <div style="font-size:0.7rem; color:#8bb5e0; letter-spacing:2px;">🔐 PAIRING CIPHER 🔐</div>
                    <div class="pair-code" id="futuristicCodeBlock">${escapeHtml(code)}</div>
                    <div class="copy-hint">⤏ TAP TO COPY ⤎</div>
                </div>
            `;
            
            // Get the code element and also the whole card (better UX)
            const codeElement = document.getElementById('futuristicCodeBlock');
            const cardWrapper = document.getElementById('codeCardWrapper');
            
            // Copy function to be used
            const performCopy = (e) => {
                e.stopPropagation();
                copyToClipboardFixed(code);
                // Visual feedback on the code element
                if (codeElement) {
                    const originalText = codeElement.innerText;
                    const originalLetterSpacing = codeElement.style.letterSpacing;
                    codeElement.innerText = "✓ COPIED! ✓";
                    codeElement.style.color = "#0f0";
                    codeElement.style.textShadow = "0 0 10px #0f0";
                    codeElement.style.letterSpacing = "2px";
                    setTimeout(() => {
                        codeElement.innerText = originalText;
                        codeElement.style.color = "#e879ff";
                        codeElement.style.textShadow = "0 0 12px #bc13fe";
                        codeElement.style.letterSpacing = originalLetterSpacing || "6px";
                    }, 1200);
                }
            };
            
            // Attach click events (both on code and card for better accessibility)
            if (codeElement) {
                codeElement.addEventListener('click', performCopy);
            }
            if (cardWrapper) {
                cardWrapper.addEventListener('click', performCopy);
            }
        }
        
        // ULTRA RELIABLE COPY FUNCTION (works everywhere)
        function copyToClipboardFixed(text) {
            // Method 1: Modern clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(err => {
                    console.warn('Clipboard API failed, using fallback', err);
                    fallbackCopyText(text);
                });
            } else {
                fallbackCopyText(text);
            }
        }
        
        // Fallback copy method (works on all browsers including old ones)
        function fallbackCopyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.top = '-9999px';
            textarea.style.left = '-9999px';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            textarea.setSelectionRange(0, text.length);
            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (err) {
                console.error('Fallback copy error', err);
            }
            document.body.removeChild(textarea);
            if (!success) {
                // Last resort: alert the user
                alert('Press Ctrl+C to copy: ' + text);
            }
        }
        
        // Legacy copyCode function for any external calls (ensures compatibility)
        window.copyCode = function(code) {
            copyToClipboardFixed(code);
            const displayBlock = document.querySelector('.pair-code');
            if (displayBlock) {
                const originalText = displayBlock.innerText;
                displayBlock.innerText = "✓ COPIED! ✓";
                displayBlock.style.color = "#0f0";
                displayBlock.style.textShadow = "0 0 10px #0f0";
                setTimeout(() => {
                    displayBlock.innerText = originalText;
                    displayBlock.style.color = "#e879ff";
                    displayBlock.style.textShadow = "0 0 12px #bc13fe";
                }, 1200);
            } else {
                // simple toast style alert but smooth
                const resDiv = document.getElementById("result");
                if (resDiv) {
                    const toastMsg = document.createElement('div');
                    toastMsg.innerText = '✓ CODE COPIED ✓';
                    toastMsg.style.position = 'fixed';
                    toastMsg.style.bottom = '20px';
                    toastMsg.style.left = '50%';
                    toastMsg.style.transform = 'translateX(-50%)';
                    toastMsg.style.backgroundColor = '#0cf';
                    toastMsg.style.color = '#000';
                    toastMsg.style.padding = '8px 18px';
                    toastMsg.style.borderRadius = '40px';
                    toastMsg.style.fontFamily = 'Orbitron';
                    toastMsg.style.fontWeight = 'bold';
                    toastMsg.style.zIndex = '9999';
